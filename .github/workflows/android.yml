name: Android

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Publish Nightly
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: de.bloat Nightly
          body: |
            Latest automatic de.bloat build from main.

            This build is generated by GitHub Actions and may contain unfinished changes.
          prerelease: false
          files: app/build/outputs/apk/debug/app-debug.apk
